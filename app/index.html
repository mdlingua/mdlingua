<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title></title>

    <meta name="viewport" content="width=device-width">

    <!-- Content Security Policy
         Restricts resource loading to trusted origins only.
         - default-src 'self'          : fallback; only load from same origin
         - script-src 'self' GA        : allow local scripts + Google Analytics
         - style-src 'self' 'unsafe-inline' : allow local CSS + Angular runtime inline styles (ng-show/hide)
         - img-src 'self' data: GA     : allow local images, data URIs, GA beacon pixels
         - connect-src 'self' GA       : allow XHR/fetch to self + GA analytics endpoint
         - font-src 'self'             : only self-hosted fonts
         - object-src 'none'           : block Flash/plugins entirely
         - media-src 'self'            : allow local audio (SpeechSynthesis is browser-native, no media src needed)
         - frame-src 'none'            : no iframes
         - base-uri 'self'             : prevent base tag hijacking
         - form-action 'self'          : prevent form submission to external URLs
    -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self' https://www.google-analytics.com;
      style-src 'self' 'unsafe-inline';
      img-src 'self' data: https://www.google-analytics.com;
      connect-src 'self' https://www.google-analytics.com https://stats.g.doubleclick.net;
      font-src 'self';
      object-src 'none';
      media-src 'self';
      frame-src 'none';
      base-uri 'self';
      form-action 'self';
    ">

    <!-- Place favicon.ico and apple-touch-icon.png in the root directory -->

    <!-- endbower -->

  -->
